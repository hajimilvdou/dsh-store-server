<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 插件商城 · 管理端</title>
<style>
:root{--brand1:#6a5cff;--brand2:#00c2a8;--gold:#f5a623;--up:#2ea043;--danger:#ff6b6b;
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2330;--line:#2b3340;--tx:#e6edf3;--tx2:#8b98a5;--hover:#1f2630}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--tx);font-size:12.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--tx2);font-weight:500;padding:7px 9px;border-bottom:1px solid var(--line);font-size:11.5px}
td{padding:8px 9px;border-bottom:1px solid var(--line);color:var(--tx)}
tr:hover td{background:var(--hover)}
.pill{font-size:10.5px;padding:2px 8px;border-radius:8px}
.pill.ok{background:rgba(46,160,67,.14);color:var(--up)}
.pill.wa{background:rgba(245,166,35,.14);color:var(--gold)}
.pill.ba{background:rgba(255,107,107,.14);color:var(--danger)}
.abtn{font-size:11.5px;padding:4px 11px;border:1px solid var(--line);border-radius:7px;color:var(--tx)}
.abtn:hover{border-color:var(--brand2);color:var(--brand2)}
.abtn.pri{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;border:none}
.abtn.dan{color:var(--danger)}
/* 登录页 */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
.login-card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:28px;width:360px}
.login-card h2{font-size:16px;margin-bottom:6px}
.login-card p{font-size:12px;color:var(--tx2);margin-bottom:14px}
.login-card .row{display:flex;gap:8px;margin-top:12px}
.login-card input{flex:1}
/* 布局 */
#app{display:flex;height:100vh}
.a-nav{width:196px;background:var(--bg2);border-right:1px solid var(--line);padding:14px 10px;flex:none;overflow-y:auto}
.a-nav .nl{font-size:13px;font-weight:700;padding:4px 10px 12px;color:var(--tx)}
.a-nav button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--tx2);margin-bottom:2px;gap:8px}
.a-nav button.on{background:linear-gradient(135deg,rgba(106,92,255,.18),rgba(0,194,168,.14));color:var(--tx);font-weight:600}
.a-nav .logout{margin-top:10px;border:1px solid var(--line);color:var(--danger);justify-content:center}
.a-main{flex:1;overflow-y:auto;padding:18px 22px}
.a-title{font-size:17px;font-weight:700;margin-bottom:14px}
.a-title small{font-size:12px;color:var(--tx2);font-weight:400}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:14px}
.stat .v{font-size:23px;font-weight:800;color:var(--tx);word-break:break-all}
.stat .k{font-size:12px;color:var(--tx2);margin-top:3px}
.stat .s{font-size:11px;margin-top:5px;color:var(--up)}
.a-card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:14px}
.a-card h4{font-size:13.5px;margin-bottom:10px;color:var(--tx)}
.frow{display:flex;gap:10px;margin-bottom:10px}
.frow input,.frow select,.frow textarea{flex:1}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.cfg .ci{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:var(--bg3);border:1px solid var(--line);border-radius:9px;font-size:12.5px}
.cfg .ci input{width:84px;text-align:right}
.cfg .ci .lab{color:var(--tx2);font-size:12px}
.cfg .ci.wide{grid-column:1/-1;align-items:flex-start;flex-direction:column;gap:6px}
.cfg .ci.wide .lab{width:100%}
.cfg .ci input.wide{width:100%;text-align:left}
.cfg .ci textarea{width:100%;min-height:64px;text-align:left}
.cfg .ci .ck{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:12px}
.cfg .ci .ck input{width:auto}
.cfg .ci .sv{flex:none;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;color:var(--tx2);white-space:nowrap}
.cfg .ci .sv:hover{border-color:var(--brand2);color:var(--brand2)}
.cfg .ci .sv.ok{color:var(--up);border-color:var(--up)}
.update-banner{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.5);border-radius:10px;margin-bottom:12px;color:var(--tx);font-size:12.5px}
.update-banner b{color:var(--gold)}
.secbadge{font-size:10px;padding:1.5px 7px;border-radius:8px;white-space:nowrap}
.secbadge.ok{background:rgba(46,160,67,.14);color:var(--up)}
.secbadge.wa{background:rgba(245,166,35,.14);color:var(--gold)}
.secbadge.ba{background:rgba(255,107,107,.14);color:var(--danger)}
.msg{margin-top:10px;font-size:12px;color:var(--tx2);line-height:1.6}
.msgbox{padding:9px 11px;border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:8px;background:var(--bg3);font-size:12px;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h2>🛠 插件商城 · 管理端</h2>
    <div id="loginFields">
      <p>输入管理员凭证。口令 = 环境变量 <b style="color:var(--brand2)">ADMIN_TOKEN</b> 或配置中心保存的管理密码；纯离线演示模式默认 <b style="color:var(--brand2)">mock-admin</b>。</p>
      <input id="token" placeholder="管理员凭证（X-Admin-Token）" autocomplete="off">
      <div class="row"><button class="abtn pri" style="flex:1" onclick="login()">进入管理端</button></div>
    </div>
    <div id="setupFields" style="display:none">
      <p>🔐 <b>首次使用</b>：设置管理员密码（≥8 位）。设置后立即生效并进入管理端；请妥善保管，忘记需重置数据库配置。</p>
      <input id="setupPass" type="password" placeholder="设置管理员密码（至少 8 位）" autocomplete="new-password">
      <input id="setupPass2" type="password" placeholder="再次输入确认" autocomplete="new-password" style="margin-top:8px">
      <div class="row"><button class="abtn pri" style="flex:1" onclick="setupPassword()">设置并进入管理端</button></div>
    </div>
    <div id="loginErr" class="msg" style="color:var(--danger);display:none"></div>
  </div>
</div>

<div id="app" style="display:none">
  <nav class="a-nav">
    <div class="nl">🛠 插件商城 · 管理端</div>
    <button class="on" data-page="dash" onclick="page('dash')">📊 仪表盘</button>
    <button data-page="sec" onclick="page('sec')">🛡 安全监控</button>
    <button data-page="fed" onclick="page('fed')">🌐 联邦互联</button>
    <button data-page="upd" onclick="page('upd')">🔄 系统更新</button>
    <button data-page="plugins" onclick="page('plugins')">📦 插件库</button>
    <button data-page="combos" onclick="page('combos')">🗂 组合审核</button>
    <button data-page="users" onclick="page('users')">👥 用户管理</button>
    <button data-page="reports" onclick="page('reports')">📥 上报队列</button>
    <button data-page="anno" onclick="page('anno')">📢 公告管理</button>
    <button data-page="cfg" onclick="page('cfg')">⚙️ 配置中心</button>
    <button class="logout" onclick="logout()">退出</button>
  </nav>
  <main class="a-main" id="main">
    <div id="updateBanner" class="update-banner" style="display:none"></div>
    <div id="syncBanner" class="update-banner" style="display:none"></div>
    <div id="mainContent">加载中…</div>
  </main>
</div>

<script>
const TOKEN_KEY = 'dshs_admin_token'
let adminToken = localStorage.getItem(TOKEN_KEY) || ''

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'X-Admin-Token': adminToken, ...(opts.headers || {}) },
  })
  if (res.status === 401) { showLogin(); throw new Error('unauthorized') }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.message || res.statusText)
  }
  return res.json()
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
const put = (path, body) => api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
const del = (path) => api(path, { method: 'DELETE' })
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function showLogin() {
  document.getElementById('login').style.display = 'flex'
  document.getElementById('app').style.display = 'none'
  checkSetup()
}
/** 口令未配置时切换到「首次使用 · 设置密码」表单 */
async function checkSetup() {
  try {
    const res = await fetch('/admin/setup/status')
    const b = await res.json()
    const needs = !!b.needs_setup
    document.getElementById('setupFields').style.display = needs ? 'block' : 'none'
    document.getElementById('loginFields').style.display = needs ? 'none' : 'block'
  } catch {
    document.getElementById('setupFields').style.display = 'none'
    document.getElementById('loginFields').style.display = 'block'
  }
}
function loginErr(text) {
  const err = document.getElementById('loginErr')
  err.textContent = text
  err.style.display = 'block'
}
function enterPanel() {
  document.getElementById('login').style.display = 'none'
  document.getElementById('app').style.display = 'flex'
  page(currentPage)
}
async function setupPassword() {
  const p1 = document.getElementById('setupPass').value
  const p2 = document.getElementById('setupPass2').value
  if (p1.length < 8) return loginErr('密码至少 8 位')
  if (p1 !== p2) return loginErr('两次输入的密码不一致')
  try {
    const res = await fetch('/admin/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p1 }),
    })
    const b = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(b.message || res.statusText)
    adminToken = p1
    localStorage.setItem(TOKEN_KEY, p1)
    enterPanel()
  } catch (e) {
    loginErr('设置失败：' + e.message)
  }
}
function login() {
  adminToken = document.getElementById('token').value.trim()
  localStorage.setItem(TOKEN_KEY, adminToken)
  api('/admin/stats').then(enterPanel).catch((e) => {
    loginErr('凭证无效：' + e.message)
  })
}
function logout() {
  localStorage.removeItem(TOKEN_KEY)
  adminToken = ''
  showLogin()
}

let currentPage = 'dash'
function page(p) {
  currentPage = p
  document.querySelectorAll('.a-nav button[data-page]').forEach((b) => b.classList.toggle('on', b.dataset.page === p))
  const main = document.getElementById('mainContent')
  main.innerHTML = '加载中…'
  const render = RENDER[p] || (() => '<div class="a-card">页面建设中</div>')
  Promise.resolve(render()).then((html) => { main.innerHTML = html }).catch((e) => {
    main.innerHTML = `<div class="a-card"><h4>加载失败</h4><div class="msg" style="color:var(--danger)">${esc(e.message)}</div></div>`
  })
  checkUpdateBanner()
  checkSyncBanner()
}

/* 服务端版本横幅：按跟踪通道（release/commit）显示检测结果 → 顶部横幅 + 一键跳转更新页 + 忽略 */
const vtag = (t) => (t && !String(t).startsWith('v') ? 'v' + t : t)
function ignoreUpdate(v) {
  localStorage.setItem('dshs_ignored_update', v)
  checkUpdateBanner()
}
function checkUpdateBanner() {
  const el = document.getElementById('updateBanner')
  if (!el || !adminToken) return
  api('/admin/update/status').then((st) => {
    const isCommit = st.track === 'commit'
    const latest = isCommit
      ? (st.latest_commit ? st.latest_commit.sha.slice(0, 7) : null)
      : (st.latest_release && st.latest_release.tag ? vtag(st.latest_release.tag) : null)
    const ignored = localStorage.getItem('dshs_ignored_update')
    if (latest && st.current_version && latest !== st.current_version && ignored !== latest) {
      el.style.display = 'flex'
      el.innerHTML = (isCommit
        ? `🆕 服务端有新提交 <b>${esc(latest)}</b>（当前部署 ${esc(st.current_version)}）`
        : `🆕 服务端有新版本 <b>${esc(latest)}</b>（当前运行 ${esc(st.current_version)}）`) +
        `<button class="abtn pri" onclick="page('upd')">⚡ 一键更新</button>` +
        `<button class="abtn" style="margin-left:auto" onclick="ignoreUpdate('${esc(latest)}')">忽略</button>`
    } else {
      el.style.display = 'none'
    }
  }).catch(() => {})
}

/* GitHub 抓取实时进度横幅：手动点击开始后轮询 /admin/sync，任何页面顶部都能看到 */
let syncTimer = null
function renderSyncBanner(st) {
  const el = document.getElementById('syncBanner')
  if (!el) return
  const p = st.progress || {}
  if (!p.stage || p.stage === 'idle') {
    el.style.display = 'none'
    return
  }
  const pct = p.total > 0 ? Math.max(0, Math.min(100, Math.round((p.done / p.total) * 100))) : (p.stage === 'searching' ? 0 : 100)
  const stageText = p.stage === 'searching' ? '搜索阶段'
    : p.stage === 'extracting' ? '提取阶段'
    : p.stage === 'trending' ? '趋势榜重算'
    : p.stage === 'error' ? '抓取失败'
    : '抓取完成'
  el.style.display = 'flex'
  el.innerHTML = `🔎 GitHub 插件抓取 ${p.running ? '进行中' : '已结束'} · ${esc(stageText)} · ${esc(p.phase || '')}${p.current ? ' · ' + esc(p.current) : ''}` +
    `<span style="flex:1;height:6px;background:var(--bg3);border-radius:3px;margin:0 10px;overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,var(--brand1),var(--brand2));transition:width .4s"></span></span>` +
    `<span style="white-space:nowrap;color:var(--gold)"><b>${pct}%</b> · ${p.done}/${p.total || '?'}</span>`
  if (!p.running) setTimeout(() => { el.style.display = 'none' }, 6000)
}
function checkSyncBanner() {
  if (!adminToken) return
  api('/admin/sync').then((st) => {
    renderSyncBanner(st)
    if (st.progress && st.progress.running) pollSyncBanner()
  }).catch(() => {})
}
function pollSyncBanner() {
  clearInterval(syncTimer)
  syncTimer = setInterval(async () => {
    try {
      const st = await api('/admin/sync')
      renderSyncBanner(st)
      if (!(st.progress && st.progress.running)) {
        clearInterval(syncTimer)
        // 抓取结束后刷新数据页（仅仪表盘 / 插件库，不打断其他页面）
        if (st.progress && st.progress.done > 0 && (currentPage === 'dash' || currentPage === 'plugins')) page(currentPage)
      }
    } catch { /* 页面切换后忽略 */ }
  }, 1500)
}
function startSyncNow() {
  post('/admin/sync', {}).then((st) => {
    renderSyncBanner(st)
    if (st.progress && st.progress.running) pollSyncBanner()
  }).catch((e) => {
    const el = document.getElementById('syncBanner')
    if (el) {
      el.style.display = 'flex'
      el.innerHTML = '🔎 GitHub 抓取启动失败：' + esc(e.message)
      setTimeout(() => { el.style.display = 'none' }, 6000)
    }
  })
}

/* ============ 页面渲染 ============ */
const RENDER = {}

RENDER.dash = async () => {
  const [stats, sync, combos, reports, plugins] = await Promise.all([
    api('/admin/stats'), api('/admin/sync'), api('/admin/combos'), api('/admin/reports'), api('/admin/plugins'),
  ])
  const pendingCombos = combos.filter((c) => c.status === 'pending').length
  const pendingReports = reports.filter((r) => r.status === 'pending').length
  const needsReview = plugins.filter((p) => p.status === 'needs_review').length
  return `<div class="a-title">📊 仪表盘</div>
  <div class="stat-row">
    <div class="stat"><div class="v">${stats.plugins_total}</div><div class="k">收录插件</div><div class="s">↑ 今日收录同步中</div></div>
    <div class="stat"><div class="v">${stats.users_registered}</div><div class="k">注册用户（GitHub）</div><div class="s">↑ 今日 +${stats.today_new_users}</div></div>
    <div class="stat"><div class="v">${stats.combos_published}</div><div class="k">组合已发布</div><div class="s">待审 ${pendingCombos}</div></div>
    <div class="stat"><div class="v" style="font-size:16px">${esc(stats.today_star_champion || '—')}</div><div class="k">今日星增冠军</div><div class="s">趋势榜已更新</div></div>
  </div>
  <div class="a-card"><h4>同步状态</h4><table>
    <tr><th>任务</th><th>状态</th><th>结果</th></tr>
    <tr><td>GitHub 增量同步（topic:dsh-plugin）</td><td>${sync.enabled ? '<span class="pill ok">已启用（token ×' + sync.tokens + '）</span>' : '<span class="pill wa">未配置 GITHUB_TOKENS</span>'}</td><td>${esc(sync.last_result || '—')} <button class="abtn pri" onclick="startSyncNow()">▶ 立即抓取</button></td></tr>
    <tr><td>⭐ 星数快照 / 趋势榜重算</td><td><span class="pill ok">随同步任务</span></td><td>${esc(sync.last_run_at || '—')}</td></tr>
  </table>
  <div class="msgbox" id="syncMsg" style="display:none"></div></div>
  <div class="a-card"><h4>待办</h4><table>
    <tr><th>类型</th><th>数量</th><th>入口</th></tr>
    <tr><td>提取质量待人工完善（needs_review）</td><td>${needsReview}</td><td><button class="abtn" onclick="page('plugins')">去处理</button></td></tr>
    <tr><td>组合待审核</td><td>${pendingCombos}</td><td><button class="abtn" onclick="page('combos')">去审核</button></td></tr>
    <tr><td>库外插件上报待处理</td><td>${pendingReports}</td><td><button class="abtn" onclick="page('reports')">去收录</button></td></tr>
  </table></div>`
}

RENDER.sec = async () => {
  const [health, plugins, reports, users, risk] = await Promise.all([api('/admin/health'), api('/admin/plugins'), api('/admin/reports'), api('/admin/users'), api('/admin/risk-queue')])
  const blocked = plugins.filter((p) => p.security.blocked || p.status === 'blocked').length
  const pendingReports = reports.filter((r) => r.status === 'pending').length
  const pendingRisk = risk.filter((r) => r.status === 'pending').length
  const riskRows = risk.length
    ? risk.map((r) => `<tr>
    <td><b>${esc(r.login)}</b></td>
    <td>${esc(r.target)}</td>
    <td style="font-size:11.5px">${esc(r.reason)}</td>
    <td style="font-size:11.5px">${esc(r.ip)}</td>
    <td style="font-size:11.5px">${esc((r.at || '').slice(0, 16).replace('T', ' '))}</td>
    <td>${r.status === 'pending'
      ? `<button class="abtn pri" onclick="riskAction(${r.id},'include')">✓ 计入</button> <button class="abtn dan" onclick="riskAction(${r.id},'reject')">✕ 清除</button>`
      : r.status === 'included' ? '<span class="pill ok">已计入</span>' : '<span class="pill ba">已清除</span>'}</td>
  </tr>`).join('')
    : '<tr><td colspan="6" style="color:var(--tx2)">风控队列为空</td></tr>'
  const today = new Date().toISOString().slice(0, 10)
  const todayNew = users.filter((u) => (u.registered_at || '').slice(0, 10) === today).length
  const apiErr = health.api_error_rate == null ? '—' : health.api_error_rate + '%'
  const diskText = health.disk.used_gb == null ? '—' : `${health.disk.used_gb} GB / ${health.disk.total_gb} GB（${health.disk.pct}%）`
  const diskPill = health.disk.pct == null ? '<span class="pill ok">正常</span>' : health.disk.pct >= 90 ? '<span class="pill ba">告急</span>' : health.disk.pct >= 80 ? '<span class="pill wa">偏高</span>' : '<span class="pill ok">充足</span>'
  return `<div class="a-title">🛡 安全监控 <small>（阈值与告警 webhook 在配置中心可调）</small></div>
  <div class="stat-row">
    <div class="stat"><div class="v">${users.length}</div><div class="k">注册用户（GitHub）</div><div class="s">↑ 今日 +${todayNew}</div></div>
    <div class="stat"><div class="v">${plugins.length} / ${plugins.filter((p) => p.trending_rank).length}</div><div class="k">插件在架 / 趋势榜</div><div class="s">待完善 ${plugins.filter((p) => p.status === 'needs_review').length}</div></div>
    <div class="stat"><div class="v" style="color:var(--danger)">${blocked} / ${pendingReports}</div><div class="k">问题插件：系统拉黑 / 用户举报</div><div class="s" style="color:var(--danger)">风控待复核 ${pendingRisk} · 举报待处置 ${pendingReports}</div></div>

RENDER.upd = async () => {
  const [st, cfg] = await Promise.all([api('/admin/update/status'), api('/admin/config')])
  const isCommit = cfg.update.track === 'commit'
  const latestRelease = st.latest_release && st.latest_release.tag ? vtag(st.latest_release.tag) : ''
  const latestCommit = st.latest_commit ? st.latest_commit.sha : ''
  const target = isCommit ? 'main' : latestRelease
  const latestRow = isCommit
    ? `<tr><th>最新提交（${esc(cfg.update.track)} 通道）</th><td>${latestCommit ? `<b style="color:var(--gold)">${esc(latestCommit.slice(0, 7))}</b>` : '—'}</td><td>${st.latest_commit && st.latest_commit.message ? esc(String(st.latest_commit.message).split('\n')[0].slice(0, 40)) : '—'}</td></tr>`
    : `<tr><th>最新 Release（release 通道）</th><td>${latestRelease ? `<b style="color:var(--gold)">${esc(latestRelease)}</b>` : '—'}</td><td>${st.latest_release && st.latest_release.published_at ? esc(String(st.latest_release.published_at).slice(0, 10)) : '—'}</td></tr>`
  return `<div class="a-title">🔄 系统更新 <small>（跟踪通道：${isCommit ? '提交 commit' : '正式版 Release'} · 在配置中心「系统更新检测 → 跟踪通道」切换）</small></div>
  <div class="a-card"><h4>🔍 检测源与手动检测</h4>
    <div class="frow"><input id="repoUrl" value="${esc(cfg.update.repo_url || '')}" placeholder="https://github.com/your-org/dsh-store-server"><button class="abtn" style="flex:none" onclick="saveRepoUrl()">保存地址</button><button class="abtn pri" style="flex:none" onclick="checkUpdateNow()">🔍 一键检测</button></div>
    <div class="msg">${isCommit ? '当前通道 = 提交：一键检测请求默认分支最新提交；一键更新拉取对应镜像（分支名 main / commit sha）。' : '当前通道 = Release：一键检测请求 GitHub 最新 Release；一键更新拉取对应版本镜像（v 前缀版本 tag）。'}自动检测按配置中心「检测间隔」执行。</div>
    <div class="msgbox" id="updCheck" style="display:none"></div></div>
  <div class="a-card"><h4>📦 客户端插件版本推送 <small>（推送后客户端检测到比自身新即弹横幅提示更新）</small></h4>
    <div class="frow"><input id="cpVer" value="${esc(cfg.client.plugin_version || '')}" placeholder="版本号，如 0.4.0（留空 = 不推送）" style="max-width:240px"></div>
    <div class="frow"><input id="cpSpec" value="${esc(cfg.client.install_spec || '')}" placeholder="安装地址（spec），如 github:yourname/dsh-store" style="max-width:560px"><button class="abtn pri" style="flex:none" onclick="saveClientPush()">保存推送</button></div>
    <div class="msg">安装地址支持三种写法（客户端更新命令 = <b>dsh plugin add &lt;安装地址&gt;@&lt;版本&gt;</b>）：<br>
    ① GitHub 仓库（推荐）：<b>github:owner/repo</b>，例如 <b>github:yourname/dsh-store</b> → 客户端执行 dsh plugin add github:yourname/dsh-store@0.4.0<br>
    ② npm 包名：<b>npm:包名</b>，例如 npm:dsh-store（已发布到 npm registry 时）<br>
    ③ 直链安装包：<b>https://example.com/dsh-store-0.4.0.tgz</b>（可访问的 tar 包直链）<br>
    版本号只填数字（如 0.4.0，不带 v）；留空表示不推送更新提醒。</div>
    <div class="msgbox" id="cpMsg" style="display:none"></div></div>
  <div class="a-card" style="border-color:rgba(245,166,35,.5)"><h4>⬆️ 更新状态</h4><table>
    <tr><th>当前运行版本</th><td><b>${esc(st.current_version || st.from_version)}</b></td><td>${isCommit ? '<span class="pill ok">commit 通道</span>' : '<span class="pill ok">release 通道</span>'}</td></tr>
    <tr><th>目标版本</th><td>${st.to_version ? `<b style="color:var(--gold)">${esc(st.to_version)}</b>` : '—'}</td><td>${st.stage === 'done' ? '<span class="pill ok">已完成</span>' : st.stage === 'failed' ? '<span class="pill ba">失败（已回滚）</span>' : '<span class="pill wa">' + esc(st.stage) + '</span>'}</td></tr>
    ${latestRow}
  </table>
  <div class="frow" style="margin-top:10px"><input id="targetVer" value="${esc(target)}" placeholder="${isCommit ? '分支名或 commit sha，如 main' : '目标版本，如 v0.1 或 v0.1.0'}" style="max-width:280px"><button class="abtn pri" style="flex:none" onclick="runUpdate()">⚡ 一键更新</button></div>
  <div class="msg">一键更新分两种模式（自动识别）：<br>
  · <b>容器部署（deploy-remote.sh / deploy-docker.sh）</b>：面板直接拉取对应镜像并自动重建本容器，自检失败自动回滚旧镜像，全程无需登录服务器；<br>
  · <b>宿主机 git 部署</b>：git 拉取 → 构建 → 迁移 → 切换 → 自检 → 失败自动回滚。<br>

  <div class="msgbox" id="updLog" style="display:none">${(st.log || []).map((l) => esc(l)).join('\n')}${st.error ? '\n' + esc(st.error) : ''}</div></div>`
}

let pluginQuery = ''
let pluginPage = 1
const PLUGIN_PAGE_SIZE = 20

RENDER.plugins = async () => {
  const [plugins] = await Promise.all([api('/admin/plugins'), api('/admin/blocklist')])
  const q = pluginQuery.trim().toLowerCase()
  const filtered = plugins.filter((p) =>
    !q ||
    String(p.id).toLowerCase().includes(q) ||
    String(p.author || '').toLowerCase().includes(q) ||
    String(p.repo || '').toLowerCase().includes(q) ||
    String(p.description || '').toLowerCase().includes(q) ||
    String(p.install || '').toLowerCase().includes(q),
  )
  const total = filtered.length
  const pages = Math.max(1, Math.ceil(total / PLUGIN_PAGE_SIZE))
  if (pluginPage > pages) pluginPage = pages
  const pageItems = filtered.slice((pluginPage - 1) * PLUGIN_PAGE_SIZE, pluginPage * PLUGIN_PAGE_SIZE)
  const rows = pageItems.map((p) => `<tr>
    <td><b>${esc(p.id)}</b>${p.install ? `<br><span style="font-size:11px;color:var(--tx2)">dsh plugin add ${esc(p.install)}</span>` : ''}</td>
    <td>${esc(p.author || '—')}</td>
    <td>${p.source === 'official' ? '<span class="pill ok">官方</span>' : '<span class="pill wa">社区</span>'}</td>
    <td>${p.stars}</td><td style="color:var(--up)">+${p.stars_delta_day}</td><td>${p.quality_score}</td>
    <td>${p.security.blocked ? '<span class="secbadge ba">已拉黑</span>' : p.security.risk_tags.length ? `<span class="secbadge wa">${p.security.risk_tags.length} 风险</span>` : `<span class="secbadge ok">L${p.security.level}</span>`}</td>
    <td>${p.status === 'blocked' ? '<span class="pill ba">已拉黑</span>' : p.status === 'needs_review' ? '<span class="pill wa">待完善</span>' : '<span class="pill ok">已收录</span>'}</td>
    <td><a href="${esc(p.repo_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--brand1);text-decoration:none;font-size:11.5px">源地址 ↗</a> ${p.security.blocked ? `<button class="abtn" onclick="unblock('${p.id}')">解除拉黑</button>` : `<button class="abtn dan" onclick="block('${p.id}')">拉黑</button>`}</td>
  </tr>`).join('')
  const pageBtns = Array.from({ length: pages }, (_, i) => {
    const n = i + 1
    return `<button class="abtn" style="${n === pluginPage ? 'border-color:var(--brand2);color:var(--brand2)' : ''}" onclick="pluginPage=${n};page('plugins')">${n}</button>`
  }).join('')
  // 进入页面时若后台扫描进行中 → 恢复进度横幅并继续轮询
  api('/admin/scan/status').then((st) => { renderScanBanner(st); if (st.running) pollScan() }).catch(() => {})
  return `<div class="a-title">📦 插件库 <small>（事件驱动安全扫描 · 人工覆盖永不被同步覆盖）</small></div>
  <div id="scanBanner" class="update-banner" style="display:none"></div>
  <div class="a-card">
    <div class="frow">
      <input id="pluginSearch" placeholder="搜索插件名 / 作者 / 仓库 / 安装地址 / 简介…" value="${esc(pluginQuery)}">
      <button class="abtn pri" style="flex:none" onclick="pluginQuery=document.getElementById('pluginSearch').value.trim();pluginPage=1;page('plugins')">搜索</button>
      <button class="abtn" style="flex:none" onclick="pluginQuery='';pluginPage=1;page('plugins')">重置</button>
      <button class="abtn pri" style="flex:none" onclick="startScanAll()">🛡 一键扫描</button>
    </div>
    <div class="msg" style="margin-bottom:8px">共 <b style="color:var(--brand2)">${total}</b> 个插件 · 第 ${pluginPage}/${pages} 页（每页 ${PLUGIN_PAGE_SIZE} 条）· 一键扫描 = 对全部在架插件执行 L0~L2 安全扫描并回写安全分/风险标签</div>
    <table>
      <tr><th>插件</th><th>作者</th><th>来源</th><th>⭐</th><th>📈日增</th><th>质量分</th><th>安全</th><th>状态</th><th>操作</th></tr>
      ${rows || '<tr><td colspan="9" style="color:var(--tx2)">无匹配插件</td></tr>'}
    </table>
    ${pages > 1 ? `<div class="frow" style="margin-top:10px;flex-wrap:wrap">${pageBtns}</div>` : ''}
  </div>`
}

/* ============ 操作 ============ */
function flash(id, text, ok = true) {
  const el = document.getElementById(id)
  if (!el) return
  el.textContent = text
  el.style.display = 'block'
  el.style.borderLeftColor = ok ? 'var(--brand2)' : 'var(--danger)'
}
async function act(fn, msgId, successText) {
  try { await fn(); flash(msgId, successText) } catch (e) { flash(msgId, e.message, false) }
}

/* ============ 插件库一键安全扫描（后台任务 + 进度横幅轮询） ============ */
let scanTimer = null
function renderScanBanner(st) {
  const el = document.getElementById('scanBanner')
  if (!el) return
  const pct = st.total ? Math.round((st.done / st.total) * 100) : 0
  el.style.display = 'flex'
  el.innerHTML = `🛡 安全扫描 ${st.running ? '进行中' : '已完成'}：${st.done}/${st.total}（失败 ${st.failed} · 发现风险 ${st.risk}）${st.current ? ' · 正在扫描 ' + esc(st.current) : ''}` +
    `<span style="flex:1;height:6px;background:var(--bg3);border-radius:3px;margin:0 10px;overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,var(--brand1),var(--brand2));transition:width .4s"></span></span>` +
    `<span style="white-space:nowrap;color:var(--gold)"><b>${pct}%</b></span>`
  if (!st.running) setTimeout(() => { el.style.display = 'none' }, 6000)
}
function startScanAll() {
  post('/admin/scan', {}).then((st) => {
    renderScanBanner(st)
    if (st.running) pollScan()
    else if (st.message) renderScanBanner(st)
  }).catch((e) => {
    const el = document.getElementById('scanBanner')
    if (el) { el.style.display = 'flex'; el.innerHTML = '🛡 扫描启动失败：' + esc(e.message) }
  })
}
function pollScan() {
  clearInterval(scanTimer)
  scanTimer = setInterval(async () => {
    try {
      const st = await api('/admin/scan/status')
      renderScanBanner(st)
      if (!st.running) {
        clearInterval(scanTimer)
        // 仅当仍停留在插件库页时刷新列表（避免把用户从其他页面拽回来）
        if (st.done > 0 && document.getElementById('scanBanner')) page('plugins')
      }
    } catch { /* 页面切换后忽略 */ }
  }, 2000)
}
function setPath(obj, path, val) {
  const parts = path.split('.')
  let cur = obj
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = {}
    cur = cur[parts[i]]
  }
  cur[parts[parts.length - 1]] = val
}
function fieldValue(el) {
  const kind = el.dataset.kind
  if (kind === 'password') {
    if (!el.value.trim()) throw new Error('密码不能为空：输入新值后再保存')
    return el.value
  }
  if (kind === 'password-optional') return el.value
  if (kind === 'tokens') return el.value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean)
  if (kind === 'bool') return el.value === '1'
  if (kind === 'number') {
    const n = Number(el.value)
    if (el.value.trim() === '' || !Number.isFinite(n)) throw new Error('请输入有效数字')
    return n
  }
  if (kind === 'methods') {
    const checked = [...document.querySelectorAll('input[data-kind="methods"]:checked')].map((x) => x.value)
    return checked.length ? checked : ['github']
  }
  return el.value
}
/** 单项保存：只改该项、其余配置不动（后端合并 + 白名单校验 + 热更新）。 */
function saveField(evt) {
  const btn = evt.currentTarget
  const row = btn.closest('.ci')
  const el = row && row.querySelector('[data-path]')
  if (!el) return
  const path = el.dataset.path
  act(async () => {
    const cfg = await api('/admin/config')
    setPath(cfg, path, fieldValue(el))
    await put('/admin/config', cfg)
    btn.classList.add('ok')
    btn.textContent = '✓ 已保存'
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = '保存' }, 1500)
  }, 'cfgMsg', '该项已保存并生效')
}
function saveCfg() {
  act(async () => {
    const cfg = await api('/admin/config')
    const els = [...document.querySelectorAll('[data-path]')]
    els.forEach((el) => {
      if (el.dataset.kind === 'methods') return
      if (el.dataset.kind === 'password' && el.value === '') return
      setPath(cfg, el.dataset.path, fieldValue(el))
    })
    const methods = els.filter((el) => el.dataset.kind === 'methods' && el.checked).map((el) => el.value)
    setPath(cfg, 'user.registration_methods', methods.length ? methods : ['github'])
    await put('/admin/config', cfg)
    page('cfg')
  }, 'cfgMsg', '配置已保存并生效（密钥热更新 · 已写审计）')
}

if (adminToken) {
  api('/admin/stats').then(enterPanel).catch(showLogin)
}
