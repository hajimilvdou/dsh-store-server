name: build-docker

# 上传 GitHub 后自动构建 Docker 镜像并推送到 GHCR（ghcr.io/<owner>/<repo>）。
# 服务器侧：GH_IMAGE=<owner>/<repo> docker compose pull && docker compose up -d（见 scripts/deploy.sh）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 镜像名必须全小写；仓库名若含大写会被拒推
      - name: 计算镜像名（小写）
        id: reg
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
